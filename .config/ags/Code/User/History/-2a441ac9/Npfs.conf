windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = Picture-in-Picture
    match:title = ^(Picture-in-Picture)$
    float = on
    pin = on
    no_initial_focus = on
    size = 540 300
    move = 850 450
    opacity = 1.0
}

# Opening apps on different windows
windowrule = match:class ^(firefox|librewolf|brave|chromium|chromium-browser|microsoft-edge|zen)$, workspace 1 silent
windowrule = match:class ^(cursor|code|codium)$, workspace 2 silent
#windowrule = match:class ^(org.gnome.Nautilus|dolphin|thunar)$, workspace 3 silent
windowrule = match:class ^(notion|notion-calendar|obsidian)$, workspace 4 silent
windowrule = match:class ^(spotify)$, workspace 5 silent
#windowrule = match:class ^(discord|element|slack)$, workspace 6 silent
#windowrule = match:class ^(mpv|vlc|mpv-qt)$, workspace 7 silent

# Ignore maximize requests
#windowrulev2 = suppressevent maximize, class:.*

# Remove the weird pop-up behavior in VSCode
#windowrulev2 = stayfocused, class:^(codium)$
#windowrule = minsize 1 1, class:^(codium)$

# Make file picker windows floating
windowrule = match:title ^(Open File|Open Folder|Open|Save|Save As|Export|Choose File|Rename|script-fu)$, float on
windowrule = match:title ^(Open File|Open Folder|Open|Save|Save As|Export|Choose File|Rename|script-fu)$, center on
windowrule = match:title ^(Open File|Open Folder|Open|Save|Save As|Export|Choose File|Rename|script-fu)$, size 600 300
windowrule = match:class xdg-desktop-portal-gtk, float on
windowrule = match:class xdg-desktop-portal-gtk, center on
windowrule = match:class xdg-desktop-portal-gtk, size 800 500
windowrule = match:class xdg-desktop-portal-hyprland, float on
windowrule = match:class xdg-desktop-portal-hyprland, center on
windowrule = match:class xdg-desktop-portal-hyprland, size 900 600

# Float All Dailog Window
windowrule = match:modal true, float on
windowrule = match:modal true, center on


# Fix some dragging issues with XWayland
#windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Make browsers opaque
#windowrule = opacity 1.0 override, class:^(zen|librewolf|firefox|brave)

windowrule = match:title font-switcher, float on
windowrule = match:title font-switcher, center on
windowrule = match:title font-switcher, size 200 300

# Nautilus
windowrule = match:class ^(org.gnome.Nautilus|thunar|dolphin)$, float on
windowrule = match:class ^(org.gnome.Nautilus|thunar|dolphin)$, center on
windowrule = match:class ^(org.gnome.Nautilus|thunar|dolphin)$, size 1100 600
windowrule = match:class ^(org.gnome.Nautilus|thunar|dolphin)$, border_size 0

# VS Code
windowrule = match:class ^(code|codium)$, float on
windowrule = match:class ^(code|codium)$, center on
windowrule = match:class ^(code|codium)$, size 1200 650
windowrule = match:class ^(code|codium)$, border_size 0

#Kitty
windowrule {
    name = terminal
    match:class = ^(kitty|ghoty|arlacity)$,
    float = on
    size = 1100 600
} 


