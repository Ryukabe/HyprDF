Include colors/colors.conf

font_family      "JetBrainsMono Nerd Font Mono"
font_size        11

disable_ligatures no
enable_audio_bell no

shell fish
shell_integration disable

cursor_shape beam

url_style curly

remember_window_size no
#initial_window_width 640
#initial_window_height 400
initial_window_width 78c
initial_window_height 23c
window_padding_width 28
cursor_blink_interval 0

background_opacity 0.80
scrolbar_handle_opacity 0
scrolbar_track_opacity 0
scrolbar_track_hover_opacity 0
confirm_os_windows_close 0

## Perfomance settings
sync_to_monitor on

## Perf
repaint_delay 8
inpute_delay  3

curosr_trail  3